<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Multiplayer Paddle Ball</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 { margin-bottom: 5px; color: #00adb5; }
        #setup { text-align: center; background: #222831; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        input { padding: 10px; font-size: 1rem; border: none; border-radius: 4px; margin-right: 10px; width: 200px; background: #fff; }
        button { padding: 10px 20px; font-size: 1rem; background-color: #00adb5; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #007c82; }
        #game-room { display: none; text-align: center; }
        #status { font-size: 1.2rem; margin-bottom: 10px; min-height: 25px; color: #eeeeee; }
        canvas { background: #111; border: 4px solid #393e46; border-radius: 4px; display: block; margin: 0 auto; }
        #share-link { background: #393e46; padding: 8px; border-radius: 4px; font-family: monospace; font-size: 0.9rem; margin-top: 10px; word-break: break-all; }
    </style>
</head>
<body>

    <!-- Matchmaking Screen -->
    <div id="setup">
        <h2>Enter Room Name</h2>
        <input type="text" id="room-input" placeholder="e.g., pong-room-xyz">
        <button onclick="joinRoom()">Join Match</button>
    </div>

    <!-- Arena Screen -->
    <div id="game-room">
        <div id="status">Connecting...</div>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="share-link"></div>
    </div>

    <!-- Firebase Realtime Database Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // Publicly usable test Firebase instance
        const firebaseConfig = { databaseURL: "https://html5-multiplayer-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let roomRef;
        let role = ""; // "host" (Left Paddle) or "client" (Right Paddle)
        let roomName = "";
        let gameInterval;

        // Constants
        const PADDLE_WIDTH = 12;
        const PADDLE_HEIGHT = 80;
        const BALL_SIZE = 10;

        // Shared Game State
        let state = {
            p1Y: 160,     // Host paddle
            p2Y: 160,     // Client paddle
            ballX: 400,
            ballY: 200,
            ballDX: 4,
            ballDY: 4,
            p1Score: 0,
            p2Score: 0,
            active: false
        };

        // Track local mouse position
        let localMouseY = 160;
        window.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            localMouseY = e.clientY - rect.top - PADDLE_HEIGHT / 2;
            // Bound inside canvas
            if (localMouseY < 0) localMouseY = 0;
            if (localMouseY > canvas.height - PADDLE_HEIGHT) localMouseY = canvas.height - PADDLE_HEIGHT;
        });

        if (window.location.hash) {
            document.getElementById('room-input').value = window.location.hash.substring(1);
        }

        function joinRoom() {
            roomName = document.getElementById('room-input').value.trim().toLowerCase();
            if (!roomName) return alert("Please type a room name.");

            window.location.hash = roomName;
            document.getElementById('setup').style.display = 'none';
            document.getElementById('game-room').style.display = 'block';

            roomRef = database.ref('pong_rooms/' + roomName);

            roomRef.once('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    role = "host";
                    roomRef.set({
                        state: state,
                        hostConnected: true,
                        clientConnected: false
                    });
                } else if (!data.clientConnected) {
                    role = "client";
                    roomRef.update({ clientConnected: true });
                } else {
                    alert("Room full! Choose another room name.");
                    window.location.reload();
                    return;
                }
                initGame();
            });
        }

        function initGame() {
            document.getElementById('share-link').innerHTML = `Opponent Link: <b>${window.location.href}</b>`;

            // Clean up network state if window closes
            if (role === "host") {
                roomRef.child("hostConnected").onDisconnect().set(false);
                roomRef.child("state/active").onDisconnect().set(false);
            } else {
                roomRef.child("clientConnected").onDisconnect().set(false);
            }

            // Sync structural loop from DB changes
            roomRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                // Sync data down
                if (role === "client") {
                    state = data.state;
                } else {
                    // Host only pulls the client's paddle position
                    state.p2Y = data.state.p2Y;
                }

                const statusDiv = document.getElementById("status");
                if (!data.clientConnected) {
                    statusDiv.innerText = "Waiting for Player 2...";
                    state.active = false;
                } else if (!data.hostConnected) {
                    statusDiv.innerText = "Host disconnected.";
                    state.active = false;
                } else {
                    statusDiv.innerText = `Score: ${state.p1Score} - ${state.p2Score}`;
                    if (!state.active && role === "host") {
                        state.active = true;
                    }
                }
            });

            // Run the local execution loop (60 FPS)
            gameInterval = setInterval(gameLoop, 1000 / 60);
        }

        function gameLoop() {
            if (role === "host") {
                state.p1Y = localMouseY; // Map host paddle to local mouse
                if (state.active) {
                    updatePhysics();
                }
                // Push everything to Firebase
                roomRef.child("state").set(state);
            } else {
                // Client only transmits their local paddle data up
                roomRef.child("state/p2Y").set(localMouseY);
            }

            renderArena();
        }

        function updatePhysics() {
            // Ball movement
            state.ballX += state.ballDX;
            state.ballY += state.ballDY;

            // Ceiling / Floor bounces
            if (state.ballY <= 0 || state.ballY >= canvas.height - BALL_SIZE) {
                state.ballDY = -state.ballDY;
            }

            // Left Paddle Collision (Host)
            if (state.ballX <= PADDLE_WIDTH) {
                if (state.ballY + BALL_SIZE >= state.p1Y && state.ballY <= state.p1Y + PADDLE_HEIGHT) {
                    state.ballDX = Math.abs(state.ballDX) + 0.3; // Speed up slightly
                    state.ballX = PADDLE_WIDTH;
                } else {
                    state.p2Score++; // Client scores
                    resetBall();
                }
            }

            // Right Paddle Collision (Client)
            if (state.ballX >= canvas.width - PADDLE_WIDTH - BALL_SIZE) {
                if (state.ballY + BALL_SIZE >= state.p2Y && state.ballY <= state.p2Y + PADDLE_HEIGHT) {
                    state.ballDX = -(Math.abs(state.ballDX) + 0.3);
                    state.ballX = canvas.width - PADDLE_WIDTH - BALL_SIZE;
                } else {
                    state.p1Score++; // Host scores
                    resetBall();
                }
            }
        }

        function resetBall() {
            state.ballX = canvas.width / 2;
            state.ballY = canvas.height / 2;
            state.ballDX = state.ballDX > 0 ? -4 : 4;
            state.ballDY = (Math.random() > 0.5 ? 4 : -4);
        }

        function renderArena() {
            // Clear canvas
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw center dashed line
            ctx.strokeStyle = "#333";
            ctx.lineWidth = 4;
            ctx.setLineDash([15, 15]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]); // Reset line dash

            // Draw Paddle 1 (Left - Orange)
            ctx.fillStyle = "#ff5722";
            ctx.fillRect(0, state.p1Y, PADDLE_WIDTH, PADDLE_HEIGHT);

            // Draw Paddle 2 (Right - Cyan)
            ctx.fillStyle = "#00adb5";
            ctx.fillRect(canvas.width - PADDLE_WIDTH, state.p2Y, PADDLE_WIDTH, PADDLE_HEIGHT);

            // Draw Ball
            if (state.active) {
                ctx.fillStyle = "#fff";
                ctx.fillRect(state.ballX, state.ballY, BALL_SIZE, BALL_SIZE);
            }
        }
    </script>
</body>
</html>
