<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Multiplayer Paddle Ball</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 { margin-bottom: 5px; color: #00adb5; }
        #setup {
            text-align: center;
            background: #222831;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        input {
            padding: 10px;
            font-size: 1rem;
            border: none;
            border-radius: 4px;
            margin-right: 10px;
            background: #fff;
        }
        button {
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #00adb5;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background-color: #007c82; }
        #game-room { display: none; text-align: center; }
        #status { font-size: 1.2rem; margin-bottom: 10px; min-height: 25px; color: #eeeeee; }
        canvas { background: #111; border: 4px solid #393e46; border-radius: 4px; display: block; margin: 0 auto; }
        #share-link { background: #393e46; padding: 8px; border-radius: 4px; font-family: monospace; font-size: 0.9rem; margin-top: 10px; word-break: break-all; }
        #error-msg { color: #ff6b6b; font-size: 0.9rem; margin-top: 8px; min-height: 20px; }
    </style>
</head>
<body>

    <h1>Paddle Strike Real-Time ⚡</h1>

    <div id="setup">
        <h2 id="setup-header">Enter Room Name</h2>
        <input type="text" id="room-input" placeholder="e.g., pong-room-xyz">
        <div id="error-msg"></div>

        <div id="speed-container" style="margin: 15px 0;">
            <label for="speed-input" style="color: #fff; margin-right: 10px;">Match Speed:</label>
            <select id="speed-input" style="padding: 8px; border-radius: 4px; border: none; background: #fff; font-size: 1rem;">
                <option value="3">Slow (Casual)</option>
                <option value="5" selected>Normal (Standard)</option>
                <option value="8">Fast (Challenging)</option>
                <option value="12">Insane (Reflex Test)</option>
            </select>
        </div>

        <button onclick="joinRoom()">Join Match</button>
    </div>

    <div id="game-room">
        <div id="status">Connecting...</div>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="share-link"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            databaseURL: "https://paddle-game-9a486-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();

        // Sign in anonymously so security rules can require `auth != null` for writes.
        // All database operations are gated on this promise.
        const authReady = auth.signInAnonymously().catch((err) => {
            console.error("Anonymous sign-in failed:", err);
            document.getElementById("error-msg").innerText =
                "Authentication failed. Please reload the page.";
            throw err;
        });

        // Auto-cleanup of stale rooms on page load. Rooms with no createdAt
        // predate this fix and are also treated as stale.
        const ROOM_TTL_MS = 30 * 60 * 1000;
        authReady.then(() => {
            database.ref("rooms").once("value", (snapshot) => {
                const now = Date.now();
                snapshot.forEach((roomSnap) => {
                    const data = roomSnap.val();
                    if (!data || !data.createdAt || (now - data.createdAt) > ROOM_TTL_MS) {
                        // Don't reap a room with two active players mid-match
                        if (data && data.active && data.playerCount >= 2) return;
                        roomSnap.ref.remove();
                    }
                });
            });
        }).catch(() => {});

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'hit') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'wall') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(180, now);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now); osc.stop(now + 0.08);
            } else if (type === 'score') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.setValueAtTime(600, now + 0.08);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now); osc.stop(now + 0.25);
            }
        }

        let roomRef;
        let role = "";
        let roomName = "";
        let gameInterval;

        const PADDLE_WIDTH = 12;
        const PADDLE_HEIGHT = 80;
        const BALL_SIZE = 10;
        const SPEED_MULTIPLIER = 1.05;
        const MAX_BALL_SPEED = 25;   // cap to prevent tunneling at extreme speeds
        const PADDLE_WRITE_INTERVAL = 50; // ms — throttle paddle writes to Firebase

        let ballX, ballY, ballDX, ballDY;
        // Cooldown flag prevents double-bounce when ball lingers inside paddle zone
        let collisionCooldown = 0;

        let state = {
            p1Y: 160, p2Y: 160,
            ballX: 400, ballY: 200,
            ballDX: 5, ballDY: 5,
            p1Score: 0, p2Score: 0,
            active: false, baseSpeed: 5,
            playerCount: 1
        };

        let localMouseY = canvas.height / 2 - PADDLE_HEIGHT / 2;

        window.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            localMouseY = e.clientY - rect.top - PADDLE_HEIGHT / 2;
            localMouseY = Math.max(0, Math.min(canvas.height - PADDLE_HEIGHT, localMouseY));
        });

        if (window.location.hash) {
            const roomNameFromHash = window.location.hash.substring(1);
            document.getElementById('room-input').value = roomNameFromHash;
            authReady.then(() => {
                database.ref("rooms/" + roomNameFromHash).once("value", (snapshot) => {
                    if (snapshot.exists()) {
                        document.getElementById("speed-container").style.display = "none";
                        document.getElementById("setup-header").innerText = "Match Invite Found!";
                    }
                });
            }).catch(() => {});
        }

        function showError(msg) {
            document.getElementById("error-msg").innerText = msg;
        }

        function joinRoom() {
            const roomInput = document.getElementById("room-input").value.trim();
            const selectedSpeed = parseInt(document.getElementById("speed-input").value) || 5;

            // Sanitize room name — Firebase paths disallow . # $ [ ]
            if (!roomInput) { showError("Please enter a room name."); return; }
            if (!/^[a-zA-Z0-9_-]+$/.test(roomInput)) {
                showError("Room name may only contain letters, numbers, hyphens, and underscores.");
                return;
            }

            showError("");
            roomName = roomInput;
            window.location.hash = roomName;

            authReady.then(() => {
                roomRef = database.ref("rooms/" + roomName);
                startJoinTransaction(selectedSpeed);
            }).catch(() => {
                showError("Authentication failed. Please reload the page.");
            });
        }

        function startJoinTransaction(selectedSpeed) {
            // Use a transaction to atomically claim host or join as client,
            // preventing the race condition where two players both see no room and both become host.
            roomRef.transaction((current) => {
                if (current === null) {
                    return {
                        p1Y: canvas.height / 2 - PADDLE_HEIGHT / 2,
                        p2Y: canvas.height / 2 - PADDLE_HEIGHT / 2,
                        ballX: 400, ballY: 200,
                        ballDX: (Math.random() > 0.5 ? 1 : -1) * selectedSpeed,
                        ballDY: (Math.random() > 0.5 ? 1 : -1) * selectedSpeed,
                        p1Score: 0, p2Score: 0,
                        active: false, baseSpeed: selectedSpeed,
                        playerCount: 1,
                        createdAt: firebase.database.ServerValue.TIMESTAMP
                    };
                } else if (current.playerCount === 1) {
                    return { ...current, playerCount: 2, active: true };
                } else {
                    // Room is full — abort transaction by returning undefined
                    return undefined;
                }
            }, (error, committed, snapshot) => {
                if (error) {
                    showError("Connection error. Please try again.");
                    return;
                }
                if (!committed) {
                    showError("Room is full. Please choose a different room name.");
                    return;
                }

                // Assign role in the completion callback, not inside the transaction
                // function, which Firebase may call multiple times speculatively.
                const data = snapshot.val();
                role = data.playerCount === 1 ? "host" : "client";

                if (role === "host") {
                    ballX = data.ballX; ballY = data.ballY;
                    ballDX = data.ballDX; ballDY = data.ballDY;
                    roomRef.onDisconnect().remove();
                }

                document.getElementById("setup").style.display = "none";
                document.getElementById("game-room").style.display = "block";
                document.getElementById("share-link").innerText = "Match Link: " + window.location.href;

                initGame();
            });
        }

        function initGame() {
            roomRef.on("value", (snapshot) => {
                const data = snapshot.val();
                if (!data) return;
                state = data;

                if (!state.active) {
                    document.getElementById("status").innerText = "Waiting for Player 2 to click the match link...";
                } else {
                    document.getElementById("status").innerText =
                        `Player 1 (Orange): ${state.p1Score}  |  Player 2 (Teal): ${state.p2Score}`;
                }
            });

            gameInterval = setInterval(updateGame, 1000 / 60);
        }

        function resetBall(scoringPlayer) {
            ballX = 400;
            ballY = 200;
            collisionCooldown = 0;
            const base = state.baseSpeed || 5;
            // Serve toward the player who just conceded
            ballDX = scoringPlayer === 1 ? -base : base;
            ballDY = (Math.random() > 0.5 ? 1 : -1) * base;
        }

        function clampSpeed(dx, dy) {
            const speed = Math.sqrt(dx * dx + dy * dy);
            if (speed > MAX_BALL_SPEED) {
                const scale = MAX_BALL_SPEED / speed;
                return [dx * scale, dy * scale];
            }
            return [dx, dy];
        }

        let lastPaddleSendTime = 0;

        function updateGame() {
            if (!state.active) {
                draw();
                return;
            }

            // Throttle paddle position writes to avoid Firebase write storm
            const now = Date.now();
            if (now - lastPaddleSendTime > PADDLE_WRITE_INTERVAL) {
                lastPaddleSendTime = now;
                if (role === "host") {
                    roomRef.child("p1Y").set(localMouseY);
                } else if (role === "client") {
                    roomRef.child("p2Y").set(localMouseY);
                }
            }

            if (role !== "host") { draw(); return; }

            if (collisionCooldown > 0) collisionCooldown--;

            ballX += ballDX;
            ballY += ballDY;

            // Top/bottom wall bounce
            if (ballY <= 0) {
                ballY = 0;
                ballDY = Math.abs(ballDY);
                playSound('wall');
            } else if (ballY >= canvas.height - BALL_SIZE) {
                ballY = canvas.height - BALL_SIZE;
                ballDY = -Math.abs(ballDY);
                playSound('wall');
            }

            // P1 paddle collision — swept: ball leading edge crosses paddle right edge
            const p1Right = PADDLE_WIDTH;
            const ballBottom = ballY + BALL_SIZE;
            if (collisionCooldown === 0 && ballDX < 0 &&
                ballX <= p1Right && ballX >= 0 &&
                ballBottom >= state.p1Y && ballY <= state.p1Y + PADDLE_HEIGHT) {
                ballX = p1Right;
                ballDX = Math.abs(ballDX) * SPEED_MULTIPLIER;
                ballDY = ballDY * SPEED_MULTIPLIER;
                [ballDX, ballDY] = clampSpeed(ballDX, ballDY);
                collisionCooldown = 6;
                playSound('hit');
            }

            // P2 paddle collision — swept: ball trailing edge crosses paddle left edge
            const p2Left = canvas.width - PADDLE_WIDTH - BALL_SIZE;
            if (collisionCooldown === 0 && ballDX > 0 &&
                ballX >= p2Left && ballX <= canvas.width - PADDLE_WIDTH &&
                ballBottom >= state.p2Y && ballY <= state.p2Y + PADDLE_HEIGHT) {
                ballX = p2Left;
                ballDX = -Math.abs(ballDX) * SPEED_MULTIPLIER;
                ballDY = ballDY * SPEED_MULTIPLIER;
                [ballDX, ballDY] = clampSpeed(ballDX, ballDY);
                collisionCooldown = 6;
                playSound('hit');
            }

            // Scoring
            if (ballX < 0) {
                state.p2Score++;
                playSound('score');
                resetBall(2);
                roomRef.update({ p2Score: state.p2Score });
            } else if (ballX > canvas.width) {
                state.p1Score++;
                playSound('score');
                resetBall(1);
                roomRef.update({ p1Score: state.p1Score });
            }

            roomRef.update({ ballX, ballY, ballDX, ballDY });
            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Center divider
            ctx.strokeStyle = "rgba(255,255,255,0.1)";
            ctx.lineWidth = 4;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // P1 paddle (Orange)
            ctx.fillStyle = "#ff9f43";
            ctx.fillRect(0, state.p1Y, PADDLE_WIDTH, PADDLE_HEIGHT);

            // P2 paddle (Teal)
            ctx.fillStyle = "#00adb5";
            ctx.fillRect(canvas.width - PADDLE_WIDTH, state.p2Y, PADDLE_WIDTH, PADDLE_HEIGHT);

            // Ball
            if (state.active) {
                ctx.fillStyle = "#eeeeee";
                ctx.fillRect(state.ballX, state.ballY, BALL_SIZE, BALL_SIZE);
            }
        }
    </script>
</body>
</html>
